<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Restaurant POS</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #fafafa;
      color: #111;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 360px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; color: #555; }
    button {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>This page hasn't been loaded before, so it can't open without internet.
       If the POS screen itself was already open, go back to that tab —
       it keeps working and will queue any orders you take.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
